[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-xiuxian-3"
version = "0.1.0.dev1"
description = "A maintainable NoneBot cultivation text game, implemented from scratch."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "xiuxian3 maintainers"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
xiuxian3 = "xiuxian3.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xiuxian3 = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: uses a temporary persistence boundary",
  "web: exercises Web contracts",
  "e2e: exercises an end-to-end flow",
  "recovery: exercises backup and recovery behavior",
]