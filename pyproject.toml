[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-xiuxian-3"
dynamic = ["version"]
description = "A maintainable NoneBot cultivation text game, implemented from scratch."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "xiuxian3 maintainers"}]
dependencies = ["nonebot2>=2.4"]

[project.optional-dependencies]
test = ["pytest>=8"]
billing = ["cryptography>=41"]

[tool.setuptools]
include-package-data = true

[project.scripts]
xiuxian3 = "nonebot_plugin_xiuxian_3.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nonebot_plugin_xiuxian_3*"]

[tool.setuptools.package-data]
nonebot_plugin_xiuxian_3 = ["data/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "integration: uses a temporary persistence boundary",
  "web: exercises Web contracts",
  "e2e: exercises an end-to-end flow",
  "recovery: exercises backup and recovery behavior",
]
