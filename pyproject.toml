[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-xiuxian-3"
version = "0.1.0.dev1"
description = "A maintainable NoneBot cultivation text game, implemented from scratch."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "xiuxian3 maintainers"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
nonebot = ["nonebot2>=2.4"]
onebot = ["nonebot-adapter-onebot>=2.4.6"]
qq = ["nonebot-adapter-qq>=1.7.1"]

[project.scripts]
xiuxian3 = "nonebot_plugin_xiuxian_3.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nonebot_plugin_xiuxian_3*"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "integration: uses a temporary persistence boundary",
  "web: exercises Web contracts",
  "e2e: exercises an end-to-end flow",
  "recovery: exercises backup and recovery behavior",
]
